
services:
  backend:
    build: ./backend
    container_name: team-task-backend
    ports:
      - "8081:5000"
    volumes:
      - team-task-data:/app/data
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: team-task-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  team-task-data:
    driver: local